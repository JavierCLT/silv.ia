<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SILVIA - Asistente virtual de seguros MAPFRE. Consulta sobre seguros de auto, hogar, vida y salud.">
    <meta name="theme-color" content="#DA291C">
    <title>SILVIA - Asistente de Seguros MAPFRE</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-header-logo">
                <span>M</span>
            </div>
            <div class="chat-header-info">
                <h1>SILVIA</h1>
                <p><span class="status-dot"></span>Asistente de Seguros MAPFRE</p>
            </div>
        </div>

        <!-- Selector de tipo de seguro -->
        <div class="insurance-selector">
            <p>Selecciona el tipo de seguro:</p>
            <div class="insurance-buttons">
                <button class="insurance-btn active" data-type="auto">
                    <span class="icon">🚗</span>Auto
                </button>
                <button class="insurance-btn" data-type="hogar">
                    <span class="icon">🏠</span>Hogar
                </button>
                <button class="insurance-btn" data-type="vida">
                    <span class="icon">❤️</span>Vida
                </button>
                <button class="insurance-btn" data-type="salud">
                    <span class="icon">🏥</span>Salud
                </button>
            </div>
        </div>

        <!-- Mensajes del chat -->
        <div class="chat-messages" id="chatMessages">
            <!-- Los mensajes se insertan aquí dinámicamente -->
        </div>

        <!-- Área de input -->
        <div class="chat-input-area">
            <div class="chat-input-container">
                <input
                    type="text"
                    class="chat-input"
                    id="userInput"
                    placeholder="Escribe tu pregunta sobre seguros..."
                    autocomplete="off"
                >
                <button class="send-btn" id="sendBtn" aria-label="Enviar mensaje">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="chat-footer">
            <p>Agente exclusiva MAPFRE | <a href="tel:918000000">918.XXX.XXX</a></p>
        </div>
    </div>

    <!-- Modal de captura de leads -->
    <div class="modal-overlay" id="leadModal">
        <div class="modal">
            <div class="modal-icon">📱</div>
            <h2>¡Te contactamos por WhatsApp!</h2>
            <p>Déjanos tus datos y te enviaremos un presupuesto personalizado adaptado a tu situación exacta.</p>
            <form id="leadForm">
                <div class="form-group">
                    <label for="leadName">Tu nombre</label>
                    <input type="text" id="leadName" placeholder="Ej: María García" required>
                </div>
                <div class="form-group">
                    <label for="leadPhone">Tu teléfono (WhatsApp)</label>
                    <input type="tel" id="leadPhone" placeholder="Ej: 612 345 678" required>
                </div>
                <div class="form-group">
                    <label for="leadInsurance">Seguro de interés</label>
                    <input type="text" id="leadInsurance" readonly>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" id="closeModal">Ahora no</button>
                    <button type="submit" class="btn-primary">Enviar</button>
                </div>
            </form>
            <div class="success-message" id="successMessage" style="display: none;">
                <span>✅</span>
                <span>¡Gracias! Te contactaremos pronto por WhatsApp.</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/mapfre-knowledge.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
